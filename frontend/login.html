<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MockAPI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo"><a href="/">MockAPI</a></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/pricing">Pricing</a>
                <a href="/docs">Docs</a>
                <a href="/signup">Sign Up</a>
            </div>
        </nav>
        <div class="auth-form">
            <h2>Login</h2>
            <div id="message"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button class="btn-primary" onclick="login()">Login</button>
            <p class="auth-alt">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </div>
    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!email || !password) {
                msg.innerHTML = '<p class="error">All fields required</p>';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();

                if (data.error) {
                    msg.innerHTML = `<p class="error">${data.error}</p>`;
                } else {
                    msg.innerHTML = '<p class="success">Login successful! Redirecting...</p>';
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                }
            } catch (err) {
                msg.innerHTML = '<p class="error">Network error</p>';
            }
        }
    </script>
</body>
</html>
