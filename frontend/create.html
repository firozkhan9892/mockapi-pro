<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create REST API Mock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo"><a href="/">MockAPI</a></div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/pricing">Pricing</a>
                <a href="/docs">Docs</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/logout">Logout</a>
            </div>
        </nav>
        <div class="create-form">
            <h2>Create REST API Mock</h2>
            <p class="hint">One resource handles all HTTP methods: GET (list), POST (create), PUT (update), DELETE (remove).</p>
            <div class="form-group">
                <label>API Name</label>
                <input type="text" id="name" placeholder="Users API" value="Users API">
            </div>
            <div class="form-group">
                <label>Resource Path</label>
                <input type="text" id="endpoint" placeholder="/users" value="/users">
            </div>
            <div class="form-group">
                <label>Supported Methods</label>
                <div class="method-checkboxes">
                    <label><input type="checkbox" class="method-cb" value="GET" checked> GET</label>
                    <label><input type="checkbox" class="method-cb" value="POST" checked> POST</label>
                    <label><input type="checkbox" class="method-cb" value="PUT" checked> PUT</label>
                    <label><input type="checkbox" class="method-cb" value="DELETE" checked> DELETE</label>
                </div>
            </div>
            <button class="btn-primary" onclick="createApi()">Create REST API →</button>
            <div id="result" class="result hidden">
                <h3>REST API Created!</h3>
                <p>TODO example URLs</p>
                <div class="url-box">
                    <code id="api_url"></code>
                    <button onclick="copyUrl()">Copy</button>
                </div>
                <div class="remaining">
                    REST APIs remaining: <span id="remaining"></span>/5
                </div>
            </div>
        </div>
    </div>
    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (!res.ok) {
                    window.location.href = '/login';
                }
            } catch (e) {
                window.location.href = '/login';
            }
        }
        checkAuth();

        async function createApi() {
            const name = document.getElementById('name').value.trim();
            const endpoint = document.getElementById('endpoint').value.trim();
            if (!name || !endpoint) {
                alert('Name and Resource Path are required');
                return;
            }
            const data = {
                name,
                endpoint,
                status_code: 200
            };
            try {
                const res = await fetch('/api/rest/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.error) {
                    alert(result.error);
                    return;
                }
                const meRes = await fetch('/api/me', { credentials: 'include' });
                const meData = await meRes.json();
                document.getElementById('api_url').textContent = location.origin + '/mock/' + meData.user_id + result.endpoint;
                document.getElementById('result').classList.remove('hidden');
                const listRes = await fetch('/api/rest/list', { credentials: 'include' });
                const listData = await listRes.json();
                document.getElementById('remaining').textContent = 5 - listData.total;
            } catch (err) {
                alert('Error creating API');
            }
        }
        function copyUrl() {
            const url = document.getElementById('api_url').textContent;
            navigator.clipboard.writeText(url);
            alert('Copied!');
        }
    </script>
</body>
</html>
